name: Deploy to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Commit to deploy (defaults to the triggering commit)
        required: false
        type: string

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Generate manifest and package version indexes
        run: sh generate-manifest.sh

      - name: Validate generated catalog
        run: |
          jq empty manifest.json
          meta_count="$(find packages -name '.meta' | wc -l | tr -d ' ')"
          package_count="$(jq '.packages | length' manifest.json)"
          versions_count="$(find packages -name 'versions.json' | wc -l | tr -d ' ')"
          test "$package_count" -le "$meta_count"
          test "$package_count" = "$versions_count"
          find packages -name 'versions.json' -exec jq empty {} +

      - name: Sign manifest.json
        env:
          ZENPM_PRIVATE_KEY: ${{ secrets.ZENPM_PRIVATE_KEY }}
        run: |
          printf '%s\n' "$ZENPM_PRIVATE_KEY" > zenpm-key
          openssl pkeyutl -sign -inkey zenpm-key -in manifest.json -rawin -out manifest.json.sig
          rm zenpm-key

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: .

      - name: Wait for Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 12); do
            count="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --header 'Cache-Control: no-cache' --jq '[.artifacts[] | select(.name == "github-pages-${{ github.run_attempt }}")] | length')"
            if [ "$count" -eq 1 ]; then
              exit 0
            fi
            sleep 5
          done
          echo "Pages artifact was not registered within 60 seconds." >&2
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - name: Notify Discord
        if: ${{ failure() }}
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          WORKFLOW_STATUS: ${{ job.status }}
        run: sh .github/scripts/notify-discord.sh
